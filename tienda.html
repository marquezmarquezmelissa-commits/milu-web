<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda | Milu & Me</title>
  <meta name="description" content="Compra los cajones Milu & Me por edad, tema o nivel.">
  <link rel="icon" href="img/marca/logo-insignia.png">
  <link rel="stylesheet" href="css/styles.css?v=5">
</head>
<body data-pagina="tienda">
  <!-- El header y el footer se insertan desde js/app.js -->
  <main id="contenido">

    <div class="tienda-cabecera"><div class="contenedor"><span class="eyebrow" style="color:var(--pizarra)">Tienda</span><h1>Todos los cajones</h1><p>Filtra por edad, tema o nivel.</p></div></div>
    <div class="contenedor tienda-layout">
      <aside class="filtros" aria-label="Filtros">
        <h3>Buscar</h3><input type="search" id="q-tienda" placeholder="Ej. pulpo, letras…" aria-label="Buscar en la tienda">
        <h3>Producto</h3><div class="filtro-grupo" id="f-tipo"></div>
        <h3>Edad</h3><div class="filtro-grupo" id="f-edad"></div>
        <h3>Tema</h3><div class="filtro-grupo" id="f-tema"></div>
        <h3>Nivel</h3><div class="filtro-grupo" id="f-nivel"></div>
        <p style="margin-top:18px"><button class="link" id="limpiar">Quitar filtros</button></p>
      </aside>
      <div>
        <div class="barra-res"><span id="conteo"></span><a href="producto.html?id=torre">¿Los quieres todos? Ver la torre →</a></div>
        <div class="grid-prod" id="resultados" aria-live="polite"></div>
      </div>
    </div>
  </main>
  <script src="js/data.js?v=5"></script>
  <script src="js/app.js?v=5"></script>
  <script src="js/pages.js?v=5"></script>
</body>
</html>
